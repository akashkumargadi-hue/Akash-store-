<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKASH STORE</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

header {
    background: #075e54;
    color: white;
    padding: 20px 12px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    margin-bottom: 0;
}

.search {
    display: block;
    width: 90%;
    max-width: 500px;
    padding: 13px;
    margin: 18px auto;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

h2 {
    text-align: center;
}

.products {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    padding: 12px;
    max-width: 900px;
    margin: auto;
}

.card {
    background: white;
    padding: 12px;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 2px 8px #ddd;
}

.product-image {
    font-size: 55px;
    padding: 15px 0;
}

.card h3 {
    font-size: 17px;
}

.price {
    color: #075e54;
    font-weight: bold;
    font-size: 19px;
}

button {
    background: #075e54;
    color: white;
    border: none;
    padding: 11px;
    border-radius: 6px;
    cursor: pointer;
    width: 100%;
    font-size: 14px;
}

.cart {
    background: white;
    padding: 18px;
    margin: 20px 12px;
    border-radius: 10px;
}

#cartItems p {
    border-bottom: 1px solid #ddd;
    padding: 8px 0;
}

.remove {
    background: #b42318;
    width: auto;
    margin-left: 8px;
}

.order {
    display: block;
    max-width: 350px;
    margin: 15px auto;
    text-decoration: none;
    text-align: center;
}

footer {
    text-align: center;
    background: #075e54;
    color: white;
    padding: 18px;
    margin-top: 25px;
}

@media (min-width: 650px) {
    .products {
        grid-template-columns: repeat(3, minmax(0, 1fr));
    }
}
</style>
</head>

<body>

<header>
    <h1>🛍️ AKASH STORE</h1>
    <p>Quality Products at Affordable Prices</p>
</header>

<input
    class="search"
    id="search"
    type="search"
    placeholder="🔍 Search products..."
>

<h2>Our Products</h2>

<div class="products" id="products"></div>

<section class="cart">
    <h2>🛒 My Cart</h2>
    <div id="cartItems">Your cart is empty.</div>
    <h3>Total: ₹<span id="total">0</span></h3>
    <button onclick="checkout()">Place Order on WhatsApp</button>
    <p id="message"></p>
</section>

<footer>
    <p>AKASH STORE</p>
    <p>Thank you for shopping with us!</p>
</footer>

<script>
const products = [
{
id: 1,
name: "Groundnut Oil",
price: 100,
image: "🛢️"
},
{
id: 2,
name: "Sunflower Oil",
price: 150,
image: "🧴"
},
{
id: 3,
name: "Karam Powder",
price: 80,
image: "🌶️"
},
{
id: 4,
name: "Pasupu Powder",
price: 120,
image: "🟡"
}
];

let cart = [];

function showProducts(list) {
    const area = document.getElementById("products");
    area.innerHTML = "";

    list.forEach(product => {
        area.innerHTML += `
            <div class="card">
                <div class="product-image">${product.image}</div>
                <h3>${product.name}</h3>
                <p class="price">₹${product.price}</p>
                <button onclick="addToCart(${product.id})">
                    Add to Cart
                </button>
            </div>
        `;
    });

    if (list.length === 0) {
        area.innerHTML = "<p>No products found.</p>";
    }
}

function addToCart(id) {
    const item = cart.find(product => product.id === id);

    if (item) {
        item.quantity++;
    } else {
        const product = products.find(product => product.id === id);
        cart.push({...product, quantity: 1});
    }

    showCart();
}

function removeFromCart(id) {
    cart = cart.filter(product => product.id !== id);
    showCart();
}

function showCart() {
    const area = document.getElementById("cartItems");
    let total = 0;

    if (cart.length === 0) {
        area.innerHTML = "Your cart is empty.";
    } else {
        area.innerHTML = cart.map(item => {
            total += item.price * item.quantity;

            return `
                <p>
                    ${item.name} × ${item.quantity}
                    = ₹${item.price * item.quantity}
                    <button class="remove"
                    onclick="removeFromCart(${item.id})">
                    Remove
                    </button>
                </p>
            `;
        }).join("");
    }

    document.getElementById("total").textContent = total;
}

document.getElementById("search").addEventListener("input", event => {
    const query = event.target.value.toLowerCase();

    showProducts(
        products.filter(product =>
            product.name.toLowerCase().includes(query)
        )
    );
});

function checkout() {
    if (cart.length === 0) {
        alert("Please add products to your cart first.");
        return;
    }

    let message = "Hello AKASH STORE! I want to order:\n";
    let total = 0;

    cart.forEach(item => {
        message += `${item.name} x ${item.quantity} = ₹${item.price * item.quantity}\n`;
        total += item.price * item.quantity;
    });

    message += `Total: ₹${total}\nPlease confirm availability and delivery details.`;

    const phone = prompt(
        "Enter your store WhatsApp number with country code, without + sign:"
    );

    if (!phone || !/^\d{10,15}$/.test(phone)) {
        alert("Please enter a valid WhatsApp number.");
        return;
    }

    window.open(
        "https://wa.me/" + phone + "?text=" + encodeURIComponent(message),
        "_blank"
    );
}

showProducts(products);
</script>

</body>
</html>
