<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKASH STORE</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

header {
    background: #075e54;
    color: white;
    padding: 20px;
    text-align: center;
}

.search {
    display: block;
    width: 90%;
    max-width: 500px;
    padding: 13px;
    margin: 18px auto;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 6px;
}

h2 {
    text-align: center;
}

.products {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    padding: 12px;
    max-width: 900px;
    margin: auto;
}

.card {
    background: white;
    padding: 12px;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 2px 8px #ddd;
}

.product-image {
    font-size: 55px;
    padding: 15px;
}

.price {
    color: #075e54;
    font-weight: bold;
    font-size: 19px;
}

select {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

button {
    background: #075e54;
    color: white;
    border: none;
    padding: 13px;
    border-radius: 6px;
    cursor: pointer;
    width: 100%;
    font-size: 15px;
}

.cart, .details {
    background: white;
    padding: 20px;
    margin: 20px 12px;
    border-radius: 10px;
}

input, textarea {
    width: 100%;
    padding: 13px;
    margin: 10px 0 18px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

.remove {
    background: #b42318;
    width: auto;
    padding: 8px 12px;
}

.back {
    background: #555;
    margin-bottom: 15px;
}

.hidden {
    display: none;
}

footer {
    background: #075e54;
    color: white;
    text-align: center;
    padding: 18px;
}

@media (min-width: 650px) {
    .products {
        grid-template-columns: repeat(3, 1fr);
    }
}
</style>
</head>

<body>

<!-- FIRST PAGE -->

<div id="homePage">

<header>
    <h1>🛍️ AKASH STORE</h1>
    <p>Quality Products at Affordable Prices</p>
</header>

<input
    class="search"
    id="search"
    type="search"
    placeholder="🔍 Search products..."
>

<h2>Our Products</h2>

<div class="products" id="products"></div>

<section class="cart">

    <h2>🛒 My Cart</h2>

    <div id="cartItems">Your cart is empty.</div>

    <h3>Total: ₹<span id="total">0</span></h3>

    <button onclick="goToDetails()">
        Place Order
    </button>

</section>

<footer>
    <p>AKASH STORE</p>
    <p>Thank you for shopping with us!</p>
</footer>

</div>


<!-- SECOND PAGE -->

<div id="detailsPage" class="hidden">

<header>
    <h1>📋 Delivery Details</h1>
    <p>Enter Your Customer Details</p>
</header>

<section class="details">

    <button class="back" onclick="goBack()">
        ← Back to Shopping
    </button>

    <form id="customerForm">

        <label>Customer Name</label>
        <input
            type="text"
            id="customerName"
            placeholder="Enter your full name"
            required
        >

        <label>Phone Number</label>
        <input
            type="tel"
            id="customerPhone"
            placeholder="Enter 10-digit phone number"
            pattern="[0-9]{10}"
            maxlength="10"
            inputmode="numeric"
            required
        >

        <label>Full Address</label>
        <textarea
            id="customerAddress"
            placeholder="House number, street, village/town, district"
            rows="4"
            required
        ></textarea>

        <label>PIN Code</label>
        <input
            type="text"
            id="customerPin"
            placeholder="Enter 6-digit PIN code"
            pattern="[0-9]{6}"
            maxlength="6"
            inputmode="numeric"
            required
        >

        <h3>Total: ₹<span id="finalTotal">0</span></h3>

        <button type="submit">
            Confirm Order on WhatsApp
        </button>

    </form>

</section>

</div>


<script>

// PRODUCT DETAILS

const products = [

    {
        id: 1,
        name: "Pappu nune",
        telugu: "పప్పు నూనె",
        image: "🛢️",
        variants: [
            { size: "1 Litre", price: 480 },
            { size: "½ Litre", price: 240 }
        ]
    },

    {
        id: 2,
        name: "kobari nune",
        telugu: "కొబ్బరి నూనె",
        image: "🥥",
        variants: [
            { size: "1 Litre", price: 260 },
            { size: "½ Litre", price: 130 }
        ]
    },

    {
        id: 3,
        name: "nuvula nuve",
        telugu: "నువ్వుల నూనె",
        image: "🧴",
        variants: [
            { size: "1 Litre", price: 240 },
            { size: "½ Litre", price: 120 }
        ]
    },

    {
        id: 4,
        name: "verusenaga nune",
        telugu: "వేరుశెనగ నూనె",
        image: "🥜",
        variants: [
            { size: "1 Litre", price: 340 },
            { size: "½ Litre", price: 170 }
        ]
    },

    {
        id: 5,
        name: "kura karam",
        telugu: "కూర కారం",
        image: "🌶️",
        variants: [
            { size: "1 KG", price: 360 },
            { size: "½ KG", price: 180 },
            { size: "¼ KG", price: 90 }
        ]
    },

    {
        id: 6,
        name: "pachadi karam",
        telugu: "పచ్చడి కారం",
        image: "🌶️",
        variants: [
            { size: "1 KG", price: 500 },
            { size: "½ KG", price: 250 },
            { size: "¼ KG", price: 125 }
        ]
    },

    {
        id: 7,
        name: "pasupu",
        telugu: "పసుపు",
        image: "🟡",
        variants: [
            { size: "1 KG", price: 220 },
            { size: "½ KG", price: 110 },
            { size: "¼ KG", price: 55 }
        ]
    },

    {
        id: 8,
        name: "Kumkum",
        telugu: "కుంకుమ",
        image: "🔴",
        variants: [
            { size: "1 KG", price: 240 },
            { size: "½ KG", price: 120 },
            { size: "¼ KG", price: 60 }
        ]
    },

    {
        id: 9,
        name: "Nupappu",
        telugu: "నుపప్పు",
        image: "🌾",
        variants: [
            { size: "1 KG", price: 240 },
            { size: "½ KG", price: 120 },
            { size: "¼ KG", price: 60 }
        ]
    },

    {
        id: 10,
        name: "Telaga Pindi",
        telugu: "తెలగపిండి",
        image: "🌾",
        variants: [
            { size: "1 KG", price: 100 },
            { size: "½ KG", price: 50 },
            { size: "¼ KG", price: 25 }
        ]
    }

];


// CART

let cart = [];


// DISPLAY PRODUCTS

function showProducts(list) {

    const area = document.getElementById("products");

    area.innerHTML = "";

    list.forEach(product => {

        const options = product.variants.map((variant, index) => `
            <option value="${index}">
                ${variant.size} - ₹${variant.price}
            </option>
        `).join("");

        area.innerHTML += `

        <div class="card">

            <div class="product-image">
                ${product.image}
            </div>

            <h3>${product.name}</h3>

            <p>${product.telugu}</p>

            <select id="size-${product.id}">
                ${options}
            </select>

            <button onclick="addToCart(${product.id})">
                Add to Cart
            </button>

        </div>

        `;

    });

    if (list.length === 0) {
        area.innerHTML = "<p>No products found.</p>";
    }

}


// ADD TO CART

function addToCart(id) {

    const product = products.find(p => p.id === id);

    const selectedIndex =
        document.getElementById("size-" + id).value;

    const variant = product.variants[selectedIndex];

    const item = cart.find(p =>
        p.id === id && p.size === variant.size
    );

    if (item) {

        item.quantity++;

    } else {

        cart.push({
            id: id,
            name: product.name,
            telugu: product.telugu,
            size: variant.size,
            price: variant.price,
            quantity: 1
        });

    }

    showCart();

}


// REMOVE FROM CART

function removeFromCart(index) {

    cart.splice(index, 1);

    showCart();

}


// DISPLAY CART

function showCart() {

    const area = document.getElementById("cartItems");

    let total = 0;

    if (cart.length === 0) {

        area.innerHTML = "Your cart is empty.";

    } else {

        area.innerHTML = cart.map((item, index) => {

            const itemTotal = item.price * item.quantity;

            total += itemTotal;

            return `

            <p>

                <b>${item.name}</b> (${item.telugu})<br>

                Size: ${item.size}<br>

                ₹${item.price} × ${item.quantity}
                = ₹${itemTotal}

                <button class="remove"
                onclick="removeFromCart(${index})">
                    Remove
                </button>

            </p>

            <hr>

            `;

        }).join("");

    }

    document.getElementById("total").textContent = total;

    document.getElementById("finalTotal").textContent = total;

}


// OPEN CUSTOMER DETAILS

function goToDetails() {

    if (cart.length === 0) {

        alert("Please add products to your cart first.");

        return;

    }

    document.getElementById("homePage").classList.add("hidden");

    document.getElementById("detailsPage").classList.remove("hidden");

    window.scrollTo(0, 0);

}


// BACK TO SHOPPING

function goBack() {

    document.getElementById("detailsPage").classList.add("hidden");

    document.getElementById("homePage").classList.remove("hidden");

    window.scrollTo(0, 0);

}


// SEARCH PRODUCTS

document.getElementById("search").addEventListener("input", event => {

    const query = event.target.value.toLowerCase();

    showProducts(

        products.filter(p =>

            p.name.toLowerCase().includes(query) ||

            p.telugu.includes(query)

        )

    );

});


// WHATSAPP ORDER

document.getElementById("customerForm").addEventListener("submit", function(event) {

    event.preventDefault();

    let name = document.getElementById("customerName").value.trim();

    let phoneNumber = document.getElementById("customerPhone").value.trim();

    let address = document.getElementById("customerAddress").value.trim();

    let pin = document.getElementById("customerPin").value.trim();


    let message = "NEW ORDER - AKASH STORE\n\n";

    message += "Customer Name: " + name + "\n";

    message += "Phone Number: " + phoneNumber + "\n";

    message += "Address: " + address + "\n";

    message += "PIN Code: " + pin + "\n\n";

    message += "ORDER DETAILS:\n";


    let total = 0;

    cart.forEach(item => {

        const itemTotal = item.price * item.quantity;

        message += item.name + " (" + item.telugu + ")\n";

        message += "Size: " + item.size + "\n";

        message += "Quantity: " + item.quantity + "\n";

        message += "Amount: ₹" + itemTotal + "\n\n";

        total += itemTotal;

    });


    message += "Total Amount: ₹" + total;


    const storeNumber = "919701067275";

    const whatsappURL =
        "https://wa.me/" + storeNumber +
        "?text=" + encodeURIComponent(message);


    window.location.href = whatsappURL;

});


// START WEBSITE

showProducts(products);

showCart();

</script>

</body>
</html>
